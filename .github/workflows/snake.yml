name: snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8b8bff&color_dots=#ebedf0,#c6f7ea,#7cf7d4,#3fc9a8,#1f8f8a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff6ad5&color_dots=#161b22,#1f3a4a,#2b6e7a,#4fb3b0,#7cf7d4

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
